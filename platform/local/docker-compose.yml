services:
  postgres:
    image: postgres:16
    container_name: fleetops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fleetops}
      POSTGRES_USER: ${POSTGRES_USER:-fleetops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_CONTAINER_PORT:-5432}:5432"
    volumes:
      - fleetops-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-fleetops} -d $${POSTGRES_DB:-fleetops}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fleetops-local
  rabbitmq:
    image: rabbitmq:4.1.8-management
    container_name: fleetops-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-fleetops}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change_me}
    ports:
      - "${RABBITMQ_CONTAINER_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_CONTAINER_PORT:-15672}:15672"
    volumes:
      - fleetops-rabbitmq-data:/var/lib/rabbitmq

    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - fleetops-local
volumes:
  fleetops-postgres-data:
    name: fleetops-postgres-data
  fleetops-rabbitmq-data:
    name: fleetops-rabbitmq-data

networks:
  fleetops-local:
    name: fleetops-local
