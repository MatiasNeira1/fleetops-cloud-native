name: Architecture
description: Proponer o discutir una decisión arquitectónica de FleetOps.
title: "[Architecture]: "
labels: ["architecture"]
body:
  - type: textarea
    id: contexto
    attributes:
      label: Contexto
      description: Describe el contexto técnico o de producto.
    validations:
      required: true
  - type: textarea
    id: problema
    attributes:
      label: Problema arquitectónico
      description: ¿Qué decisión o problema arquitectónico se necesita resolver?
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas consideradas
      description: Lista las alternativas evaluadas.
      placeholder: |
        - Alternativa A:
        - Alternativa B:
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: Propuesta
      description: Describe la alternativa recomendada.
    validations:
      required: true
  - type: textarea
    id: consecuencias
    attributes:
      label: Consecuencias
      description: Impactos positivos, negativos, costos y trade-offs.
    validations:
      required: true
  - type: input
    id: servicios
    attributes:
      label: Servicios afectados
      placeholder: flota, telemetria, alertas, frontend, plataforma, infraestructura
  - type: dropdown
    id: adr
    attributes:
      label: Necesidad de ADR
      options:
        - Sí
        - No
    validations:
      required: true
