name: Bug
description: Reportar un comportamiento incorrecto en FleetOps.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción
      description: Describe el problema de forma clara.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      description: Indica los pasos necesarios para reproducir el problema.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
      description: ¿Qué esperabas que ocurriera?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado actual
      description: ¿Qué ocurrió realmente?
    validations:
      required: true
  - type: dropdown
    id: ambiente
    attributes:
      label: Ambiente
      options:
        - LOCAL
        - DEV
        - DEMO
    validations:
      required: true
  - type: input
    id: componente
    attributes:
      label: Componente afectado
      placeholder: backend, frontend, infra, contracts, docs, scripts, platform/local
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs relevantes
      description: Pega logs, trazas o mensajes de error relevantes. No incluyas secretos.
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: Revisé que no estoy incluyendo secretos o credenciales.
          required: true
        - label: Busqué issues existentes relacionados.
          required: true
        - label: Incluí información suficiente para reproducir o investigar el problema.
          required: true
