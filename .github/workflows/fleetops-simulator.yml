name: FleetOps Simulator

on:
  push:
    paths:
      - "backend/servicios/fleetops-simulator/**"
      - "backend/servicios/servicio-flota/**"
      - "backend/servicios/ms-alerta/**"
      - "frontend/**"
      - "infra/terraform/fleetops-simulator/**"
      - "scripts/windows/azure-simulator-terraform.ps1"
      - ".github/workflows/fleetops-simulator.yml"
  pull_request:
    paths:
      - "backend/servicios/fleetops-simulator/**"
      - "backend/servicios/servicio-flota/**"
      - "backend/servicios/ms-alerta/**"
      - "frontend/**"
      - "infra/terraform/fleetops-simulator/**"
      - ".github/workflows/fleetops-simulator.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Desplegar en el entorno FleetOps existente"
        type: boolean
        required: true
        default: false
      simulator_enabled:
        description: "Habilitar controles y movimiento (sin iniciar viajes automáticamente)"
        type: boolean
        required: true
        default: false
      publish_frontend:
        description: "Publicar el dashboard en el sitio estático existente"
        type: boolean
        required: true
        default: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Probar flota
        working-directory: backend/servicios/servicio-flota
        run: bash ./mvnw -B -ntp clean verify
      - name: Probar alertas
        working-directory: backend/servicios/ms-alerta
        run: mvn -B -ntp clean verify
      - name: Probar simulador
        working-directory: backend/servicios/fleetops-simulator
        run: bash ./mvnw -B -ntp clean verify
      - name: Probar frontend
        working-directory: frontend
        run: |
          npm ci
          npm test -- --run
          npm run build
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
      - name: Terraform fmt
        working-directory: infra/terraform/fleetops-simulator
        run: terraform fmt -check

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: verify
    runs-on: ubuntu-latest
    environment: fleetops-dev
    permissions:
      id-token: write
      contents: read
    env:
      SIMULATOR_ADMIN_TOKEN: ${{ secrets.SIMULATOR_ADMIN_TOKEN }}
      FLEETOPS_SIMULATOR_SERVICE_TOKEN: ${{ secrets.FLEETOPS_SIMULATOR_SERVICE_TOKEN }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
      - name: Publicar imágenes en ACR
        shell: bash
        run: |
          set -euo pipefail
          for service in servicio-flota ms-alerta fleetops-simulator; do
            az acr build --registry acrmunicipalidaddoc \
              --image "fleetops/${service}:sha-${GITHUB_SHA}" "backend/servicios/${service}"
            digest="$(az acr repository show --name acrmunicipalidaddoc \
              --image "fleetops/${service}:sha-${GITHUB_SHA}" --query digest -o tsv)"
            test "${digest#sha256:}" != "$digest"
            case "$service" in
              servicio-flota) name=FLOTA_IMAGE ;;
              ms-alerta) name=ALERTA_IMAGE ;;
              fleetops-simulator) name=SIMULATOR_IMAGE ;;
            esac
            echo "${name}=acrmunicipalidaddoc.azurecr.io/fleetops/${service}@${digest}" >> "$GITHUB_ENV"
          done
      - name: Revisar y aplicar Terraform y actualizar microservicios
        shell: pwsh
        run: |
          $enabled = '${{ inputs.simulator_enabled }}' -eq 'true'
          ./scripts/windows/azure-simulator-terraform.ps1 -Action Apply `
            -SimulatorImage $env:SIMULATOR_IMAGE -FlotaImage $env:FLOTA_IMAGE `
            -AlertaImage $env:ALERTA_IMAGE -SimulatorEnabled:$enabled
      - name: Publicar frontend
        if: inputs.publish_frontend
        working-directory: frontend
        env:
          VITE_ENTRA_TENANT_ID: ${{ vars.VITE_ENTRA_TENANT_ID }}
          VITE_ENTRA_CLIENT_ID: ${{ vars.VITE_ENTRA_CLIENT_ID }}
          VITE_ENTRA_API_CLIENT_ID: ${{ vars.VITE_ENTRA_API_CLIENT_ID }}
          VITE_ENTRA_REDIRECT_URI: ${{ vars.VITE_ENTRA_REDIRECT_URI }}
          VITE_ENTRA_POST_LOGOUT_REDIRECT_URI: ${{ vars.VITE_ENTRA_POST_LOGOUT_REDIRECT_URI }}
          VITE_API_SCOPE: ${{ vars.VITE_API_SCOPE }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          az storage blob upload-batch --account-name stfleetopsweb \
            --destination '$web' --source dist --auth-mode login --overwrite
