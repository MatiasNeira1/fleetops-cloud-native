spring.application.name=ms-alerta
server.port=${SERVER_PORT:8081}
server.shutdown=graceful
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:fleetops}?currentSchema=alerts
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=alerts
spring.flyway.schemas=alerts
spring.flyway.default-schema=alerts
spring.flyway.create-schemas=true
spring.rabbitmq.addresses=${SPRING_RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.default-requeue-rejected=false
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,rabbit
management.endpoint.health.show-details=never
fleetops.alerts.exchange=${RABBITMQ_ALERTS_EXCHANGE:fleetops.events.topic}
fleetops.alerts.dlx=${RABBITMQ_ALERTS_DLX:fleetops.dlx.direct}
fleetops.alerts.queue=${RABBITMQ_ALERTS_QUEUE:fleetops.alerts.queue}
fleetops.alerts.dlq=${RABBITMQ_ALERTS_DLQ:fleetops.alerts.dlq}
fleetops.alerts.routing-pattern=${RABBITMQ_ALERTS_ROUTING_PATTERN:fleetops.alert.#}
fleetops.alerts.dlq-routing-key=${RABBITMQ_ALERTS_DLQ_ROUTING_KEY:fleetops.alerts.dlq}
