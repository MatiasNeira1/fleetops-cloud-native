spring.application.name=fleetops-simulator
server.port=${SIMULATOR_PORT:8089}
server.address=${SIMULATOR_BIND_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
spring.rabbitmq.addresses=${SPRING_RABBITMQ_ADDRESSES:127.0.0.1:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
fleetops.simulator.enabled=${SIMULATOR_ENABLED:false}
fleetops.simulator.interval=${SIMULATOR_INTERVAL:5s}
fleetops.simulator.max-vehicles=${SIMULATOR_MAX_VEHICLES:3}
fleetops.simulator.max-failures=${SIMULATOR_MAX_FAILURES:5}
fleetops.simulator.random-seed=${SIMULATOR_RANDOM_SEED:42}
fleetops.simulator.normal-speed-kph=${SIMULATOR_NORMAL_SPEED_KPH:65}
fleetops.simulator.speed-limit-kph=${SIMULATOR_SPEED_LIMIT_KPH:90}
fleetops.simulator.speeding-kph=${SIMULATOR_SPEEDING_KPH:105}
fleetops.simulator.acceleration-kph-per-second=${SIMULATOR_ACCELERATION_KPH_PER_SECOND:3}
fleetops.simulator.speeding-probability=${SIMULATOR_SPEEDING_PROBABILITY:0.02}
fleetops.simulator.stop-probability=${SIMULATOR_STOP_PROBABILITY:0.01}
fleetops.simulator.scenario-ticks=${SIMULATOR_SCENARIO_TICKS:8}
fleetops.simulator.cooldown-ticks=${SIMULATOR_COOLDOWN_TICKS:24}
fleetops.simulator.fuel-percent-per-km=${SIMULATOR_FUEL_PERCENT_PER_KM:0.16}
fleetops.simulator.initial-fuel-percent=${SIMULATOR_INITIAL_FUEL_PERCENT:60}
fleetops.simulator.low-fuel-threshold-percent=${SIMULATOR_LOW_FUEL_THRESHOLD_PERCENT:15}
fleetops.simulator.admin-token=${SIMULATOR_ADMIN_TOKEN:}
fleetops.simulator.service-token=${SIMULATOR_SERVICE_TOKEN:}
fleetops.simulator.flota-base-url=${FLEETOPS_FLOTA_API_URL:http://127.0.0.1:8080}
