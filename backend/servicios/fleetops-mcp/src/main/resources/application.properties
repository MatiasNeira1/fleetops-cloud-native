spring.application.name=fleetops-mcp
logging.level.root=INFO
spring.profiles.default=local
server.port=${MCP_PORT:8088}
spring.ai.mcp.server.name=fleetops-mcp
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false
fleetops.mcp.client-token=${MCP_CLIENT_TOKEN}
fleetops.mcp.allowed-origins=${MCP_ALLOWED_ORIGINS:}
fleetops.api.flota-bearer-token=${FLEETOPS_FLOTA_API_BEARER_TOKEN:}
fleetops.api.alerta-bearer-token=${FLEETOPS_ALERTA_API_BEARER_TOKEN:}
fleetops.api.connect-timeout=${FLEETOPS_API_CONNECT_TIMEOUT:3s}
fleetops.api.read-timeout=${FLEETOPS_API_READ_TIMEOUT:10s}
