spring.application.name=servicio-flota
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:fleetops}
spring.datasource.username=${POSTGRES_USER:fleetops}
spring.datasource.password=${POSTGRES_PASSWORD:change_me}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:fleetops}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:change_me}

# Topologia RabbitMQ de FleetOps

# Exchanges
fleetops.messaging.exchanges.direct=fleetops.logs.direct
fleetops.messaging.exchanges.topic=fleetops.events.topic
fleetops.messaging.exchanges.dlx=fleetops.dlx.direct

# Colas principales
fleetops.messaging.queues.all=fleetops.logs.all.queue
fleetops.messaging.queues.errors=fleetops.logs.errors.queue
fleetops.messaging.queues.security=fleetops.logs.security.queue

# Dead Letter Queues
fleetops.messaging.dlqs.all=fleetops.logs.all.dlq
fleetops.messaging.dlqs.errors=fleetops.logs.errors.dlq
fleetops.messaging.dlqs.security=fleetops.logs.security.dlq

# Routing keys del Direct Exchange
fleetops.messaging.routing.direct.info=INFO
fleetops.messaging.routing.direct.warning=WARNING
fleetops.messaging.routing.direct.error=ERROR
fleetops.messaging.routing.direct.security=SECURITY

# Patrones del Topic Exchange
fleetops.messaging.routing.topic.all=fleetops.#
fleetops.messaging.routing.topic.errors=fleetops.*.error
fleetops.messaging.routing.topic.security=fleetops.security.#

# Routing keys de las DLQ
fleetops.messaging.routing.dead.all=fleetops.logs.all.dead
fleetops.messaging.routing.dead.errors=fleetops.logs.errors.dead
fleetops.messaging.routing.dead.security=fleetops.logs.security.dead
